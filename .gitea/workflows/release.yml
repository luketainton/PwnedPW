name: Release
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 0"

jobs:
  tag:
    name: Tag release
    uses: https://git.tainton.uk/actions/gha-workflows/.gitea/workflows/release-with-tag.yaml@main

  create_release:
    name: Create Release
    needs: tag
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.release.outputs.release_name }}
    steps:
      - name: Create release
        id: release
        env:
          TAG_NAME: ${{ needs.tag.outputs.tag_name }}
          RELEASE_BODY: ${{ needs.tag.outputs.changelog }}
          API_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: |
          payload=$(jq -n \
            --arg tag_name "$TAG_NAME" \
            --arg name "$TAG_NAME" \
            --arg body "$RELEASE_BODY" \
            '{tag_name: $tag_name, name: $name, body: $body}')
          curl --fail-with-body --silent --show-error --request POST \
            -H "Authorization: token $API_TOKEN" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}/releases"
          echo "release_name=$TAG_NAME" >> "$GITEA_OUTPUT"

  print_release:
    name: Print Release
    runs-on: ubuntu-latest
    needs: create_release
    steps:
      - run: echo "Created release ${{ needs.create_release.outputs.release_name }}."
